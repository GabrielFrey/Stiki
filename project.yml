name: Stiki

options:
  bundleIdPrefix: com.stiki
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "26.0"

configs:
  Debug: debug
  Release: release

packages:
  StikiCore:
    path: Packages/StikiCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ENABLE_MODULES: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Stiki:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: StikiCore
      - target: StikiMessages
        embed: true
      - sdk: StoreKit.framework
      - sdk: Vision.framework
      - sdk: PhotosUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stiki.app
        PRODUCT_NAME: Stiki
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Stiki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Stiki reads the photos and videos you pick so it can cut out subjects and build stickers. Everything stays on your device.
        NSPhotoLibraryAddUsageDescription: Stiki saves finished stickers to your photo library when you ask it to.
        NSCameraUsageDescription: Stiki uses the camera so you can shoot a photo and turn it into a sticker right away.
        LSApplicationQueriesSchemes:
          - whatsapp
          - tg
        CFBundleLocalizations:
          - en
          - ru
          - he
    entitlements:
      path: App/Resources/Stiki.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stiki.shared
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.stiki.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    scheme:
      testTargets:
        - name: StikiTests
          parallelizable: true
        - name: StikiUITests
      gatherCoverageData: true
      coverageTargets:
        - Stiki
        - StikiCore/StikiCore
      environmentVariables:
        - variable: STIKI_UI_TESTING
          value: "0"
          isEnabled: false
      storeKitConfiguration: Configuration.storekit

  StikiMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: MessagesExtension
    dependencies:
      - package: StikiCore
      - sdk: Messages.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stiki.app.messages
        PRODUCT_NAME: Stiki
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
    info:
      path: MessagesExtension/Resources/Info.plist
      properties:
        CFBundleDisplayName: Stiki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).StikiMessagesViewController
        CFBundleLocalizations:
          - en
          - ru
          - he
    entitlements:
      path: MessagesExtension/Resources/StikiMessages.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stiki.shared

  StikiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StikiTests
      - path: Configuration.storekit
        buildPhase: resources
    dependencies:
      - target: Stiki
      - package: StikiCore
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stiki.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stiki.app/Stiki"
        BUNDLE_LOADER: $(TEST_HOST)

  StikiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/StikiUITests
    dependencies:
      - target: Stiki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stiki.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Stiki
